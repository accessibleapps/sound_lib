name: Offline updater and package checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.8"
          python-version: "3.12"
          enable-cache: false
      - name: Run existing offline updater tests
        run: >-
          uv run --no-project --python 3.12 --with pytest==7.4.4
          --with requests --with beautifulsoup4 --with lxml --with tqdm
          pytest -q tests/test_file_manager.py tests/test_version_parser.py
          tests/test_version_tracker.py
      - name: Build distributions without loading audio libraries
        run: uv build --python 3.12
      - name: Validate declared package description
        run: uvx --python 3.12 --from twine==7.0.0 twine check --strict dist/*
